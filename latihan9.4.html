<html>

<head>
    <title>Pengertian Div</title>
</head>

<body>
    <div style="color: #ffff; margin: 0; background: purple; padding: 20px; font-size: 1.5em; text-align: center;">
        HEADER</div>
    <div
        style="color: #ffff; margin: 0; background: rgb(0, 128, 90); padding: 40px 20px; float: left; width: 21%; font-size: 1.5em; text-align: center;">
        SIDEBAR</div>
    <div
        style="color: #ffff; margin: 0; background: pink; padding: 40px 20px; float: right; width: 66%; font-size: 1.5em; text-align: center;">
        CONTENT</div>
    <div
        style="color: #ffff; margin: 0; background: red; padding: 20px; clear: both; font-size: 1.5em; text-align: center;">
        FOOTER</div>
</body>

</html>
